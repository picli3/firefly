<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="DM Sans, Segoe UI, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Arquitectura de la solución FireFly</title>
  <desc id="d">Las luminarias con el módulo FireFly forman una red inalámbrica Zigbee en malla hacia un gateway por planta. El gateway envía los datos por Ethernet con alimentación PoE, cifrados, al servidor FireFly instalado en la red del cliente. Los usuarios consultan la aplicación web desde cualquier navegador.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16785c"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#33639c"/>
    </marker>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#243b34" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1200" height="520" fill="#f4f7f5"/>

  <!-- Bandas de zona -->
  <rect x="20" y="20" width="430" height="480" rx="18" fill="#ffffff" stroke="#e0e8e1"/>
  <text x="44" y="56" font-size="15" font-weight="700" fill="#16785c" letter-spacing="1.5">1 · EDIFICIO</text>
  <text x="44" y="78" font-size="14" fill="#5f6e67">Luminarias con módulo FireFly</text>

  <rect x="470" y="20" width="240" height="480" rx="18" fill="#ffffff" stroke="#e0e8e1"/>
  <text x="494" y="56" font-size="15" font-weight="700" fill="#16785c" letter-spacing="1.5">2 · GATEWAY</text>
  <text x="494" y="78" font-size="14" fill="#5f6e67">Uno por zona o planta</text>

  <rect x="730" y="20" width="450" height="480" rx="18" fill="#ffffff" stroke="#e0e8e1"/>
  <text x="754" y="56" font-size="15" font-weight="700" fill="#16785c" letter-spacing="1.5">3 · SERVIDOR Y USUARIOS</text>
  <text x="754" y="78" font-size="14" fill="#5f6e67">En la red del cliente, sin depender de la nube</text>

  <!-- Luminarias: malla -->
  <g stroke="#16785c" stroke-width="2.5" stroke-dasharray="7 6" fill="none">
    <path d="M120 165 L250 225"/>
    <path d="M330 150 L265 220"/>
    <path d="M110 330 L250 270"/>
    <path d="M300 380 L280 290"/>
    <path d="M290 245 L520 255" marker-end="url(#a)"/>
  </g>
  <g filter="url(#s)">
    <g transform="translate(70 130)"><rect width="100" height="56" rx="12" fill="#fff" stroke="#cbd9cb"/><circle cx="30" cy="22" r="13" fill="#f2c94c"/><circle cx="70" cy="22" r="13" fill="#f2c94c"/><rect x="45" y="38" width="10" height="10" rx="2" fill="#16785c"/></g>
    <g transform="translate(290 115)"><rect width="100" height="56" rx="12" fill="#fff" stroke="#cbd9cb"/><circle cx="30" cy="22" r="13" fill="#f2c94c"/><circle cx="70" cy="22" r="13" fill="#f2c94c"/><rect x="45" y="38" width="10" height="10" rx="2" fill="#16785c"/></g>
    <g transform="translate(220 215)"><rect width="100" height="56" rx="12" fill="#fff" stroke="#16785c" stroke-width="2"/><circle cx="30" cy="22" r="13" fill="#f2c94c"/><circle cx="70" cy="22" r="13" fill="#f2c94c"/><rect x="45" y="38" width="10" height="10" rx="2" fill="#16785c"/></g>
    <g transform="translate(60 305)"><rect width="100" height="56" rx="12" fill="#fff" stroke="#cbd9cb"/><circle cx="30" cy="22" r="13" fill="#f2c94c"/><circle cx="70" cy="22" r="13" fill="#f2c94c"/><rect x="45" y="38" width="10" height="10" rx="2" fill="#16785c"/></g>
    <g transform="translate(250 360)"><rect width="100" height="56" rx="12" fill="#fff" stroke="#cbd9cb"/><circle cx="30" cy="22" r="13" fill="#f2c94c"/><circle cx="70" cy="22" r="13" fill="#f2c94c"/><rect x="45" y="38" width="10" height="10" rx="2" fill="#16785c"/></g>
  </g>
  <text x="44" y="452" font-size="14" fill="#243b34"><tspan font-weight="700">Red inalámbrica en malla (Zigbee).</tspan></text>
  <text x="44" y="472" font-size="14" fill="#5f6e67">Cada luminaria retransmite a las vecinas:</text>
  <text x="44" y="490" font-size="14" fill="#5f6e67">más luminarias, más cobertura.</text>

  <!-- Gateway -->
  <g filter="url(#s)">
    <rect x="525" y="205" width="130" height="100" rx="14" fill="#103e33"/>
    <rect x="585" y="180" width="6" height="28" rx="3" fill="#103e33"/>
    <circle cx="555" cy="285" r="5" fill="#c0eb75"/><circle cx="572" cy="285" r="5" fill="#c0eb75"/><circle cx="589" cy="285" r="5" fill="#5f8f7a"/>
    <text x="590" y="250" font-size="16" font-weight="700" fill="#f4ffeb" text-anchor="middle">FireFly</text>
    <text x="590" y="269" font-size="12" fill="#b8d3c7" text-anchor="middle">Gateway</text>
  </g>
  <text x="590" y="340" font-size="14" fill="#243b34" text-anchor="middle" font-weight="700">Hasta 50 luminarias</text>
  <text x="590" y="360" font-size="13" fill="#5f6e67" text-anchor="middle">Coordina la red y lanza</text>
  <text x="590" y="377" font-size="13" fill="#5f6e67" text-anchor="middle">las pruebas de batería</text>

  <!-- Enlace Ethernet / PoE -->
  <path d="M655 255 L805 255" stroke="#33639c" stroke-width="4" fill="none" marker-end="url(#b)"/>
  <text x="730" y="236" font-size="13" fill="#33639c" text-anchor="middle" font-weight="700">Ethernet + PoE</text>
  <text x="730" y="280" font-size="12" fill="#5f6e67" text-anchor="middle">datos y energía</text>
  <text x="730" y="296" font-size="12" fill="#5f6e67" text-anchor="middle">en un cable · cifrado</text>

  <!-- Servidor -->
  <g filter="url(#s)">
    <rect x="810" y="190" width="150" height="130" rx="14" fill="#fff" stroke="#16785c" stroke-width="2"/>
    <rect x="832" y="212" width="106" height="18" rx="4" fill="#e0ece2"/><rect x="832" y="238" width="106" height="18" rx="4" fill="#e0ece2"/><rect x="832" y="264" width="106" height="18" rx="4" fill="#e0ece2"/>
    <circle cx="846" cy="221" r="3.5" fill="#16785c"/><circle cx="846" cy="247" r="3.5" fill="#16785c"/><circle cx="846" cy="273" r="3.5" fill="#16785c"/>
    <text x="885" y="306" font-size="14" font-weight="700" fill="#243b34" text-anchor="middle">Servidor FireFly</text>
  </g>
  <text x="885" y="350" font-size="13" fill="#5f6e67" text-anchor="middle">Base de datos histórica,</text>
  <text x="885" y="367" font-size="13" fill="#5f6e67" text-anchor="middle">planificador de pruebas</text>
  <text x="885" y="384" font-size="13" fill="#5f6e67" text-anchor="middle">y reportes</text>

  <path d="M960 255 L1030 255" stroke="#16785c" stroke-width="3" fill="none" marker-end="url(#a)"/>

  <!-- Usuarios -->
  <g filter="url(#s)">
    <rect x="1035" y="170" width="125" height="85" rx="10" fill="#fff" stroke="#cbd9cb"/>
    <rect x="1035" y="170" width="125" height="16" rx="10" fill="#103e33"/>
    <rect x="1047" y="196" width="40" height="22" rx="4" fill="#e7f4ec"/><rect x="1093" y="196" width="55" height="22" rx="4" fill="#fff2df"/>
    <path d="M1047 242 L1068 230 L1090 236 L1112 224 L1148 230" stroke="#16785c" stroke-width="2.5" fill="none"/>
    <rect x="1070" y="275" width="56" height="92" rx="10" fill="#fff" stroke="#cbd9cb"/>
    <rect x="1078" y="290" width="40" height="12" rx="3" fill="#e7f4ec"/><rect x="1078" y="308" width="40" height="12" rx="3" fill="#e0ece2"/><rect x="1078" y="326" width="40" height="12" rx="3" fill="#e0ece2"/>
  </g>
  <text x="1097" y="400" font-size="14" font-weight="700" fill="#243b34" text-anchor="middle">Aplicación web</text>
  <text x="1097" y="419" font-size="13" fill="#5f6e67" text-anchor="middle">PC, tablet o móvil</text>
  <text x="1097" y="436" font-size="13" fill="#5f6e67" text-anchor="middle">con usuario y clave</text>
</svg>
